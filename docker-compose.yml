# Chatty backend — build from local clone; secrets via .env (not in git)
#
# On server (first time):
#   git clone <repo> && cd chatty_backend
#   create .env + secrets/
#   docker compose up -d --build
#
# Recreate store_knowledge (vector + FTS) on an existing DB:
#   docker compose exec -T db psql -U chatty -d chatty < docker/postgres/02-store_knowledge.sql
#   then re-sync products
#
# After code changes:
#   git pull && docker compose up -d --build

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: chatty-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatty
      POSTGRES_PASSWORD: chatty
      POSTGRES_DB: chatty
    ports:
      - "5432:5432"
    volumes:
      - chatty_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-vector.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
      - ./docker/postgres/02-store_knowledge.sql:/docker-entrypoint-initdb.d/02-store_knowledge.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatty -d chatty"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: chatty-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - chatty_redis:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatty-api:latest
    container_name: chatty-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3009:3009"
    env_file:
      - .env
    environment:
      DB_URL: postgresql://chatty:chatty@db:5432/chatty
      ENV: production
      DEBUG: "false"
    volumes:
      - ./secrets:/app/secrets:ro
      - ./Assets:/app/Assets
      - chatty_rag:/app/rag
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3009/docs')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    image: chatty-api:latest
    container_name: chatty-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    env_file:
      - .env
    environment:
      DB_URL: postgresql://chatty:chatty@db:5432/chatty
      ENV: production
      DEBUG: "false"
    volumes:
      - ./secrets:/app/secrets:ro
      - ./Assets:/app/Assets
      - chatty_rag:/app/rag
    command: ["python", "worker.py"]

volumes:
  chatty_pgdata:
  chatty_redis:
  chatty_rag:
