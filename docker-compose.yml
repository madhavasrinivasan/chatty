# Chatty backend — secrets live in .env (gitignored), not in this file.
#
# First time:
#   create .env with POSTGRES_* + app secrets (see .env.docker.example)
#   docker compose up -d --build
#
# Read data:
#   docker compose exec db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"
#   # or from host: psql "postgresql://USER:PASS@localhost:5432/DB"
#
# Recreate store_knowledge (wipes catalog):
#   docker compose exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" < docker/postgres/02-store_knowledge.sql

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: chatty-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-chatty}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - chatty_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-vector.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
      - ./docker/postgres/02-store_knowledge.sql:/docker-entrypoint-initdb.d/02-store_knowledge.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: chatty-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - chatty_redis:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatty-api:latest
    container_name: chatty-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3009:3009"
    env_file:
      - .env
    environment:
      # Inside the network, host is service name "db"
      DB_URL: postgresql://${POSTGRES_USER:-chatty}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-chatty}
      ENV: production
      DEBUG: "false"
    volumes:
      - ./secrets:/app/secrets:ro
      - ./Assets:/app/Assets
      - chatty_rag:/app/rag
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3009/docs')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    image: chatty-api:latest
    container_name: chatty-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    env_file:
      - .env
    environment:
      DB_URL: postgresql://${POSTGRES_USER:-chatty}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-chatty}
      ENV: production
      DEBUG: "false"
    volumes:
      - ./secrets:/app/secrets:ro
      - ./Assets:/app/Assets
      - chatty_rag:/app/rag
    command: ["python", "worker.py"]

volumes:
  chatty_pgdata:
  chatty_redis:
  chatty_rag:
